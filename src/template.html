<title>Oblath Product Finder</title>

<style>
[hidden] { display: none !important; }
/* Layout: a supermarket shelf. Sticky search counter on top, price-tag rows below, order basket docked at the bottom. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #283141;
  --muted: #6a7486;
  --line: #e2e7ee;
  --accent: #3f8f8c;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ef;
  --tag: #ffe9b8;
  --tag-ink: #6b4a00;
  --new: #5873d1;
  --up: #c2553f;
  --down: #2f8a5c;
  --dot-l: 72%;
  --shadow: 0 1px 2px rgba(40,49,65,.05), 0 8px 24px rgba(40,49,65,.07);
  --f-display: "Suez One", "Assistant", "Arial Hebrew", serif;
  --f-body: "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
}
/* Always light, on every device. */
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; margin: 0; letter-spacing: .2px; }
.brand h1 b { color: var(--accent); font-weight: 400; }
.listinfo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); min-width: 0; }
.listinfo span { overflow-wrap: anywhere; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.search { position: relative; }
.search input { width: 100%; font-size: 1.12rem; padding: 13px 44px 13px 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none; }
.search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; width: 34px; height: 34px; border-radius: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
@media (pointer: fine) { .chips { scrollbar-width: thin; cursor: grab; padding-bottom: 6px; } .chips::-webkit-scrollbar { display: block; height: 6px; } .chips::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; } .chips.drag { cursor: grabbing; user-select: none; } .chips.drag .chip { pointer-events: none; } }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .88rem; white-space: nowrap; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-start: 3px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.on small { color: inherit; opacity: .8; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h, 170) 55% var(--dot-l)); margin-inline-end: 6px; vertical-align: 1px; }
.chip.on .dot { background: var(--accent-ink); }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 6; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 4px; max-height: min(70vh, 460px); overflow-y: auto; }
.suggest h3 { margin: 6px 8px 2px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.suggest .cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 6px 4px; }
.suggest .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 9px; padding: 7px 10px; min-width: 0; }
.suggest .opt span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest .opt small { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.suggest .opt:hover, .suggest .opt.act, .suggest .chip.act { background: var(--accent-soft); }
.suggest .chip.act { border-color: var(--accent); }
.suggest .hint { color: var(--muted); font-size: .8rem; padding: 4px 10px 2px; }
.askai { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.askai:disabled { opacity: .7; cursor: wait; }
.askai svg, .aiflag svg { width: 14px; height: 14px; }
.aiflag { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; font-size: .85rem; }
.airow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.facets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.facets .chip { font-size: .85rem; }
.chip.newc { border-color: var(--new); color: var(--new); }
.chip.newc.on { background: var(--new); color: var(--surface); }

main .wrap { padding-block: 14px 120px; display: grid; gap: 12px; }
.assistant { display: flex; gap: 10px; align-items: flex-start; }
.assistant .av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 1rem; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; min-width: 0; flex: 1; box-shadow: var(--shadow); }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 4px; }
.bubble .term { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; font-weight: 600; white-space: nowrap; }
.bubble .term i { font-style: normal; font-weight: 400; opacity: .8; direction: ltr; unicode-bidi: isolate; }
.bubble .warn { color: var(--muted); font-size: .9rem; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sugg button { border: 1px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: .9rem; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.bar select { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px 8px; }

.list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .nm { min-width: 0; }
.item .en { font-weight: 700; direction: ltr; text-align: left; unicode-bidi: plaintext; overflow-wrap: anywhere; }
.item .hu { color: var(--muted); font-size: .86rem; direction: ltr; text-align: left; unicode-bidi: plaintext; overflow-wrap: anywhere; }
.item .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: .78rem; }
.pill { border-radius: 6px; padding: 0 7px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.new { color: var(--new); border-color: var(--new); background: transparent; font-weight: 700; }
.pill.up { color: var(--up); border-color: currentColor; background: transparent; }
.pill.down { color: var(--down); border-color: currentColor; background: transparent; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.tag { position: relative; background: var(--tag); color: var(--tag-ink); font-weight: 700; font-variant-numeric: tabular-nums; padding: 3px 10px 3px 14px; border-radius: 4px 8px 8px 4px; white-space: nowrap; direction: ltr; font-size: .98rem; }
.tag::before { content: ""; position: absolute; left: 5px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--surface); }
.tag small { font-weight: 600; font-size: .75rem; opacity: .75; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.step button { border: 0; background: transparent; width: 32px; height: 30px; font-size: 1.15rem; font-weight: 700; color: var(--accent); }
.step button:hover { background: var(--accent-soft); }
.step span { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.add { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 9px; padding: 3px 12px; font-weight: 700; font-size: .9rem; height: 32px; }
.add:hover { background: var(--accent-soft); }
.more { justify-self: center; }
.empty { text-align: center; color: var(--muted); padding: 28px 10px; }

.drop { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--accent) 85%, transparent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.6rem; padding: 20px; text-align: center; }
.loading { position: fixed; inset: 0; z-index: 31; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 20px; }
.loading div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; box-shadow: var(--shadow); text-align: center; max-width: 340px; }
.loading progress { width: 100%; margin-top: 10px; accent-color: var(--accent); }

.basket { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--accent); color: var(--accent-ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.basket button.open { width: 100%; border: 0; background: transparent; color: inherit; padding-block: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 880px; margin: 0 auto; }
.basket .sum { font-variant-numeric: tabular-nums; direction: ltr; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { background: var(--surface); width: 100%; max-width: 720px; max-height: 85%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
.sheet .head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
.sheet .body { overflow-y: auto; padding: 4px 18px; }
.barr { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fcount { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: .78rem; }
.active { display: flex; flex-wrap: wrap; gap: 6px; }
.active button { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: .86rem; }
.active button b { color: var(--accent); margin-inline-start: 4px; }
.fgroup { padding: 12px 0; border-bottom: 1px solid var(--line); }
.fgroup h3 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fgroup .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.fgroup .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fgroup .chip[aria-pressed="true"] small { color: inherit; }
.fgroup .chip:disabled { opacity: .45; }
.prange { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prange input { width: 8em; font: inherit; font-size: 1rem; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.what { color: var(--ink); font-size: .86rem; margin-top: 3px; opacity: .85; }
.what b { font-weight: 600; }
.explain { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: .8rem; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.aiex { margin-top: 4px; font-size: .86rem; background: var(--accent-soft); border-radius: 8px; padding: 6px 9px; }
.btn.big { padding: 10px 16px; font-size: 1rem; }
.fmt { margin: 0; color: var(--muted); font-size: .82rem; }
.olist { display: grid; }
.oline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.oline .en { font-weight: 700; overflow-wrap: anywhere; }
.oline .hu { color: var(--muted); font-size: .84rem; overflow-wrap: anywhere; }
.oline .gone { color: var(--up); font-size: .8rem; }
.oline .rm { border: 0; background: transparent; color: var(--muted); font-size: 1.25rem; width: 32px; height: 32px; border-radius: 8px; line-height: 1; }
.oline .rm:hover { color: var(--up); background: var(--bg); }
.oline .calc { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.oline .sku { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.oline .sku input { width: 9.5em; font: 600 .9rem/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 4px 7px; }
.oline .sku input:focus { border-style: solid; border-color: var(--accent); outline: none; }
.oline .sku input.has { border-style: solid; }
.oline .unit { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.oline .lt { margin-inline-start: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.notes { display: grid; gap: 4px; padding: 14px 0 6px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sheet .notes textarea { min-height: 64px; font: inherit; font-size: .95rem; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.sheet .total small { font-weight: 400; color: var(--muted); font-size: .85rem; }
.item .skuv { font: 600 .78rem/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted); }
.sheet .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.sheet .row .en { font-weight: 600; direction: ltr; text-align: left; unicode-bidi: plaintext; overflow-wrap: anywhere; }
.sheet .row .lt { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet .row .gone { color: var(--up); font-size: .8rem; }
.sheet .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.sheet .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; }
.sheet .total span:last-child { direction: ltr; font-variant-numeric: tabular-nums; }
.sheet .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet .actions a.btn { text-decoration: none; color: var(--ink); }
.sheet textarea { width: 100%; min-height: 110px; font: inherit; font-size: .85rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); direction: ltr; text-align: left; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .92rem; max-width: calc(100% - 32px); text-align: center; }
[dir="rtl"] .search input { padding: 13px 46px 13px 44px; }
[dir="rtl"] .search svg { left: auto; right: 14px; }
[dir="rtl"] .search .clear { right: auto; left: 8px; }
.search.has-mic input { padding-right: 84px; }
.search.has-mic .clear { right: 46px; }
.search .mic { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.search .mic svg { position: static; transform: none; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.search .mic.on { background: var(--up, #c0392b); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(192,57,43,.18); } }
[dir="rtl"] .search.has-mic input { padding-right: 46px; padding-left: 84px; }
[dir="rtl"] .search.has-mic .clear { right: auto; left: 46px; }
[dir="rtl"] .search .mic { right: auto; left: 6px; }
[dir="rtl"] .item .en, [dir="rtl"] .item .hu, [dir="rtl"] .sheet .row .en, [dir="rtl"] .suggest .opt { text-align: right; }
[dir="rtl"] .tag { border-radius: 8px 4px 4px 8px; padding: 3px 14px 3px 10px; }
[dir="rtl"] .tag::before { left: auto; right: 5px; }
#langBtn { font-weight: 700; }
.hen { font-weight: 800; font-size: 1.05rem; line-height: 1.3; }
.item .en.en2 { font-weight: 600; font-size: .92rem; }
[dir="rtl"] .hen, [dir="rtl"] .oline .en.hen { direction: rtl; text-align: right; unicode-bidi: normal; }
@media (max-width: 520px) {
  .brand h1 { font-size: 1.25rem; }
  .item { padding: 10px 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet .panel { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(30px); } }
}
</style>

<div dir="ltr" lang="en" data-root>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><b>Oblath</b> Product Finder</h1>
      <div class="listinfo">
        <span id="listMeta"></span>
        <label class="btn primary" for="file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          <span data-en="Upload new list" data-he="העלאת רשימה חדשה">Upload new list</span>
        </label>
        <button class="btn ghost" id="langBtn" type="button">עברית</button>
        <input id="file" type="file" accept=".pdf,.xlsx,.xls,.xlsm,.csv,.ods,application/pdf,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" role="combobox" aria-controls="suggest" aria-autocomplete="list" autocomplete="off" enterkeyhint="search" placeholder="Search, e.g. red wine" data-ph-en="Search, e.g. non mevushal wine under 5000" data-ph-he="חיפוש, למשל: יין לא מבושל עד 5000" aria-label="Search products">
      <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>×</button>
      <button class="mic" id="mic" type="button" aria-label="Speak your search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div class="suggest" id="suggest" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="assistant">
      <div class="av" aria-hidden="true">A</div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
    <div class="bar">
      <span id="count"></span>
      <span class="barr">
      <button class="btn" id="openFilters" type="button" aria-haspopup="dialog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span data-en="Filters" data-he="סינון">Filters</span> <span class="fcount" id="fcount" hidden></span></button>
      <label><span data-en="Sort" data-he="מיון">Sort</span>
        <select id="sort">
          <option value="rel">Best match</option>
          <option value="asc">Price: low to high</option>
          <option value="desc">Price: high to low</option>
          <option value="abc">Name A–Z</option>
        </select>
      </label>
      </span>
    </div>

  $('fmtNote').textContent = L('Same columns as ' + LIST.name + (h.length ? ' (' + h.join(' · ') + ')' : '') + ', every product in the same order, with quantities only on the products above.',
    'אותן עמודות כמו ב-' + LIST.name + (h.length ? ' (' + h.join(' · ') + ')' : '') + ', כל המוצרים באותו סדר, עם כמות רק במוצרים שלמעלה.');
}
function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2600); }

// ---------- upload a new list ----------
async function readPdf(file) {
  if (!window.pdfjsLib) throw new Error('nolib');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var buf = await file.arrayBuffer();
  var doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  var pages = [];
  for (var p = 1; p <= doc.numPages; p++) {
    $('loadMsg').textContent = L('Reading page ' + p + ' of ' + doc.numPages + '…', 'קורא עמוד ' + p + ' מתוך ' + doc.numPages + '…');
    $('loadProg').value = p / doc.numPages;
    var tc = await (await doc.getPage(p)).getTextContent();
    pages.push(tc.items.map(function (i) { return { str: i.str, x: i.transform[4], y: i.transform[5], w: i.width }; }));
  }
  return parseListPages(pages);
}
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise(function (ok, fail) {
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = function () { fail(new Error('nolib')); };
    document.head.appendChild(sc);
  });
}
async function readSheet(file) {
  $('loadMsg').textContent = L('Reading the spreadsheet…', 'קורא את הגיליון…');
  await loadXlsx();
  var wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
  var best = [];
  wb.SheetNames.forEach(function (n) {
    var rows = parseTable(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }));
    if (rows.length > best.length) { best = rows; best.sheetName = n; }
  });
  $('loadProg').value = 1;
  return best;
}
async function handleFile(file) {
  if (!file) return;
  var isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  var isSheet = /\.(xlsx|xlsm|xls|csv|ods|tsv)$/i.test(file.name) || /spreadsheet|excel|csv/i.test(file.type);
  if (!isPdf && !isSheet) { toast(L('Please choose a PDF or Excel file (.xlsx, .xls, .csv)', 'בחרו קובץ PDF או אקסל (.xlsx, .xls, .csv)')); return; }
  $('loading').hidden = false; $('loadMsg').textContent = L('Opening the file…', 'פותח את הקובץ…'); $('loadProg').value = 0;
  try {
    var rows = isPdf ? await readPdf(file) : await readSheet(file);
    if (rows.length < 3) throw new Error('empty');
    var meta = { header: rows.header || null, preamble: rows.preamble || [], cols: rows.cols || null, sheetName: rows.sheetName || null, body: rows.body || null };
    var prev = {};
    ITEMS.forEach(function (it) { prev[it.key] = it.price; });
    var nNew = 0, nChg = 0, seen = {};
    rows = rows.map(function (r) {
      var k = norm(r[0]); seen[k] = 1;
      var old = prev[k];
      var raw = r[4] || null;
      if (old === undefined) { nNew++; return [r[0], r[1], r[2], 1, null, r.bodyIdx == null ? null : r.bodyIdx, raw]; }
      if (Math.abs(old - r[2]) > 0.009) { nChg++; return [r[0], r[1], r[2], 0, old, r.bodyIdx == null ? null : r.bodyIdx, raw]; }
      return [r[0], r[1], r[2], 0, null, r.bodyIdx == null ? null : r.bodyIdx, raw];
    });
    var gone = Object.keys(prev).filter(function (k) { return !seen[k]; }).length;
    var list = { name: file.name, date: new Date().toISOString(), rows: rows, header: meta.header,
      preamble: meta.preamble, cols: meta.cols, sheetName: meta.sheetName, body: meta.body };
    loadList(list);
    var saved = store('oblath.list.v1', list);
    activeCat = 'all'; $('q').value = '';
    renderChips(); run(true); renderBasket();
    $('bubble').innerHTML = L('<p>New list loaded: <strong>' + rows.length + '</strong> products. ' + nNew + ' new, ' + nChg + ' changed price, and ' + gone + ' are no longer listed.</p>',
      '<p>רשימה חדשה נטענה: <strong>' + rows.length + '</strong> מוצרים. ' + nNew + ' חדשים, ' + nChg + ' שינו מחיר, ו-' + gone + ' כבר לא ברשימה.</p>') +
      '<p class="warn">' + (saved ? L('Saved in this browser, so it will be here next time you open the page.', 'נשמרה בדפדפן הזה, אז היא תחכה לכם בפעם הבאה.') : L('I couldn\'t save it in this browser (private mode?), so it stays only until you close the page.', 'לא הצלחתי לשמור בדפדפן (גלישה פרטית?), אז היא תישאר רק עד שתסגרו את הדף.')) + '</p>';
  } catch (e) {
    console.error(e);
    toast(e.message === 'nolib' ? L('The file reader didn\'t load. Check your internet connection and try again.', 'קורא הקבצים לא נטען. בדקו את החיבור ונסו שוב.') : L('I couldn\'t find products in this file. It needs a product name column and a price column.', 'לא מצאתי מוצרים בקובץ. צריכה להיות עמודת שם מוצר ועמודת מחיר.'));
  } finally { $('loading').hidden = true; $('file').value = ''; }
}

// ---------- wiring ----------
var deb;
$('q').addEventListener('input', function () { sugOpen = true; clearTimeout(deb); deb = setTimeout(function () { run(true); }, 140); });
$('clear').addEventListener('click', function () { $('q').value = ''; run(true); $('q').focus(); });
$('sort').addEventListener('change', function () { run(true); });
$('more').addEventListener('click', function () { shown += 80; run(false); });
(function () {
  var el = $('chips'), down = false, sx = 0, sl = 0, moved = false;
  el.addEventListener('wheel', function (e) { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && el.scrollWidth > el.clientWidth) { el.scrollLeft += (getComputedStyle(el).direction === 'rtl' ? -1 : 1) * e.deltaY; e.preventDefault(); } }, { passive: false });
  el.addEventListener('mousedown', function (e) { if (e.button !== 0) return; down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
  window.addEventListener('mousemove', function (e) { if (!down) return; var dx = e.clientX - sx; if (!moved && Math.abs(dx) > 5) { moved = true; el.classList.add('drag'); } if (moved) { el.scrollLeft = sl - dx; e.preventDefault(); } });
  window.addEventListener('mouseup', function () { if (!down) return; down = false; if (moved) setTimeout(function () { el.classList.remove('drag'); moved = false; }, 0); });
  el.addEventListener('click', function (e) { if (el.classList.contains('drag')) { e.preventDefault(); e.stopPropagation(); } }, true);
})();
$('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-c]'); if (!b) return; activeCat = b.dataset.c; renderChips(); run(true); });
$('bubble').addEventListener('click', function (e) {
  var c = e.target.closest('[data-c]'); if (c) { activeCat = c.dataset.c; run(true); return; }
  var b = e.target.closest('[data-s]'); if (!b) return; $('q').value = b.dataset.s; activeCat = 'all'; run(true);
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-add],[data-inc],[data-dec]'); if (!b) return;
  var k = b.dataset.add || b.dataset.inc || b.dataset.dec;
  if (b.dataset.dec) { cart[k] = (cart[k] || 0) - 1; if (cart[k] <= 0) delete cart[k]; } else cart[k] = (cart[k] || 0) + 1;
  saveCart();
  var scroll = window.scrollY; run(false); window.scrollTo(0, scroll);
});
$('openBasket').addEventListener('click', function () { $('sheet').hidden = false; $('basket').hidden = true; renderSheet(); });
function closeSheet() { $('sheet').hidden = true; renderBasket(); }
$('closeSheet').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-rm]'); if (!b) return;
  delete cart[b.dataset.rm]; saveCart(); run(false);
});
var downloads = null;
if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { downloads = d; }, function () {});
// the order as an Excel file in the same layout as the uploaded list
function orderWorkbook() {
  var header = (LIST.header && LIST.header.length ? LIST.header : ['Product', 'English name', 'Unit price', 'Order']).map(function (h) { return String(h == null ? '' : h); });
  var cols = LIST.cols || { name: 0, en: 1, price: 2 };
  var orderCol = -1;
  header.forEach(function (h, i) { if (orderCol < 0 && /(rendel|order|qty|quantity|mennyis|darab|amount|כמות|הזמנה)/i.test(h)) orderCol = i; });
  if (orderCol < 0) { orderCol = header.length; header.push('Order'); }
  var qty = {}, count = 0;
  orderLines().lines.forEach(function (l) { if (l.it) { qty[l.it.i] = l.n; count++; } });
  function blank(cells) { cells = cells.slice(); for (var c = 0; c < header.length; c++) if (cells[c] === undefined || cells[c] === null) cells[c] = ''; cells[orderCol] = ''; return cells; }
  var rows;
  if (LIST.body && ITEMS.every(function (it) { return it.bodyIdx != null; })) {
    // the uploaded sheet as it was (section rows included), quantities only on ordered products
    rows = LIST.body.map(blank);
    ITEMS.forEach(function (it) { if (qty[it.i]) rows[it.bodyIdx][orderCol] = qtyCell(it, qty[it.i]); });
  } else {
    rows = ITEMS.map(function (it) {
      var cells;
      if (it.raw) cells = it.raw;
      else { cells = []; cells[cols.name] = it.hu; if (cols.en >= 0) cells[cols.en] = it.en; cells[cols.price] = it.price; }
      cells = blank(cells);
      if (qty[it.i]) cells[orderCol] = qtyCell(it, qty[it.i]);
      return cells;
    });
  }
  var aoa = (LIST.preamble || []).concat([header], rows);
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var hr = (LIST.preamble || []).length;
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: hr, c: 0 }, e: { r: aoa.length - 1, c: header.length - 1 } }) };
  ws['!cols'] = header.map(function (h, c) {
    var w = String(h).length;
    rows.forEach(function (r) { w = Math.max(w, String(r[c]).length); });
    return { wch: Math.min(Math.max(w + 2, 8), 70) };
  });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (LIST.sheetName || 'Order').slice(0, 31));
  return { wb: wb, count: count };
}
$('xlsxOrder').addEventListener('click', async function () {
  var btn = this; btn.disabled = true;
  try {
    await loadXlsx();
    var w = orderWorkbook();
    if (!w.count) { toast(L('None of these products are in the current list', 'אף אחד מהמוצרים האלה לא ברשימה הנוכחית')); return; }
    var buf = XLSX.write(w.wb, { type: 'array', bookType: 'xlsx' });
    var base = String(LIST.name || 'list').replace(/\.[a-z0-9]+$/i, '');
    var name = 'Order - ' + base + ' - ' + new Date().toISOString().slice(0, 10) + '.xlsx';
    var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (downloads) {
      await downloads.save({ filename: name, data: blob });
    } else {
      // outside Claude (for example on your own Netlify address): a normal download
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
    toast(L('Excel ready: the full list, with quantities on ' + w.count + ' products', 'האקסל מוכן: כל הרשימה, עם כמות ב-' + w.count + ' מוצרים'));
  } catch (e) {
    var c = e && e.code;
    if (c === 'declined') {}
    else if (c === 'rate_limited') toast(L('A save prompt is already open', 'חלון שמירה כבר פתוח'));
    else if (e && e.message === 'nolib') toast(L('The Excel writer didn\'t load. Check your connection.', 'כלי האקסל לא נטען. בדקו את החיבור.'));
    else { console.error(e); toast(L('Couldn\'t save the Excel file here.', 'לא הצלחתי לשמור את האקסל כאן.')); }
  } finally { btn.disabled = false; }
});
$('clearOrder').addEventListener('click', function () {
  var b = $('clearOrder');
  if (b.dataset.sure) { cart = {}; saveCart(); run(false); b.textContent = L('Empty order', 'ריקון ההזמנה'); delete b.dataset.sure; return; }
  b.dataset.sure = '1'; b.textContent = L('Sure? Tap again', 'בטוח? לחצו שוב');
  setTimeout(function () { b.textContent = L('Empty order', 'ריקון ההזמנה'); delete b.dataset.sure; }, 3000);
});
$('file').addEventListener('change', function () { handleFile(this.files[0]); });
var dragN = 0;
window.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dragN++; $('drop').hidden = false; } });
window.addEventListener('dragleave', function () { if (--dragN <= 0) { dragN = 0; $('drop').hidden = true; } });
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('drop').hidden = true; handleFile(e.dataTransfer.files[0]); });
document.addEventListener('keydown', function (e) { if (e.key !== 'Escape') return; if (!$('sheet').hidden) closeSheet(); if (!$('fsheet').hidden) closeFilters(); });

// ---------- voice search (speak instead of typing) ----------
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
if (SR) { $('mic').hidden = false; document.querySelector('.search').classList.add('has-mic'); }
$('mic').addEventListener('click', function () {
  if (rec) { rec.stop(); return; }
  try { rec = new SR(); } catch (e) { toast(L('Voice input isn\'t available in this browser.', 'הקלטה קולית לא זמינה בדפדפן הזה.')); return; }
  rec.lang = LANG === 'he' ? 'he-IL' : 'en-US';
  rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  var heard = '';
  $('mic').classList.add('on'); $('mic').setAttribute('aria-label', L('Stop listening', 'עצירת ההקלטה'));
  toast(L('Listening… say what you need', 'מקשיב… אמרו מה אתם צריכים'));
  rec.onresult = function (e) {
    heard = ''; for (var i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
    $('q').value = heard; run(true);
  };
  rec.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(L('Allow the microphone for this site to search by voice.', 'אשרו גישה למיקרופון כדי לחפש בקול.'));
    else if (e.error === 'no-speech') toast(L('I didn\'t hear anything. Try again.', 'לא שמעתי כלום. נסו שוב.'));
    else if (e.error !== 'aborted') toast(L('Voice input stopped. Try again.', 'ההקלטה נעצרה. נסו שוב.'));
  };
  rec.onend = function () {
    rec = null; $('mic').classList.remove('on'); $('mic').setAttribute('aria-label', L('Speak your search', 'חיפוש בקול'));
    if (!heard.trim()) return;
    $('q').value = heard.trim(); closeSuggest(); run(true);
    // the same smart step as pressing Enter: let the assistant take over when the words alone don't find it
    if (lastQ && !lastQ.ai && sampleFn && aiState === 'idle' && (lastResults.length === 0 || lastQ.unknown.length)) askAssistant();
  };
  try { rec.start(); } catch (e) { rec = null; $('mic').classList.remove('on'); }
});

$('langBtn').addEventListener('click', function () {
  LANG = LANG === 'he' ? 'en' : 'he'; store('oblath.lang.v1', LANG); applyLang();
  var y = window.scrollY; loadList(LIST); renderChips(); run(false); renderBasket(); window.scrollTo(0, y);
});
applyLang();
heIndex();
